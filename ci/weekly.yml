name: weekly-sector-rotation
on:
  workflow_dispatch:        # run manually from the Actions tab
  # schedule:               # uncomment to refresh the site every Monday 13:00 UTC
  #   - cron: "0 13 * * 1"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python run_pipeline.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: enables the news agent
      - uses: actions/upload-artifact@v4
        with: { name: weekly-output, path: output/ }
      - name: Publish site and commit dated snapshots
        run: |
          cp output/site/index.html docs/index.html
          git config user.name "sector-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs data/fundamentals_history data/news || true
          git commit -m "weekly snapshot $(date +%F)" || echo "nothing to commit"
          git push || true
